[project]
name = "cuaas"
version = "0.1.0"
description = "Coreutils as a service"
readme = "README.md"
authors = [
    { name = "Kyle O'Malley", email = "j.kyle.omalley@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.2",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]
