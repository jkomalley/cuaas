[project]
name = "cuaas"
version = "0.1.0"
description = "Coreutils as a service"
readme = "README.md"
authors = [
    { name = "Kyle O'Malley", email = "j.kyle.omalley@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.2",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.fastapi]
entrypoint = "cuaas.main:app"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",           # conflicts with ruff format
    "D203", "D213",     # conflict with D211/D212
    "CPY001",           # no copyright headers
    "FBT001", "FBT002", # FastAPI bool query params are positional by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D", "ANN"]
