# dev vm: ubuntu 26.04. start with `just vm-up`, not limactl directly, that's
# where the repo mount and the setup scripts come from
minimumLimaVersion: 2.0.0
base: template:ubuntu-26.04

cpus: 4
memory: 4GiB
disk: 30GiB

containerd:
  system: false
  user: false

# lxd's storage pool, on its own disk instead of a loop file in the vm's disk.
# lima formats it once and mounts it at /mnt/lima-cuaas-lxd. `just vm-up` creates it
additionalDisks:
  - name: cuaas-lxd
    format: true
    fsType: btrfs
