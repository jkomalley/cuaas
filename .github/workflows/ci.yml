name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag, pin the release
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: uv sync --locked
      - run: just check
