name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # same release as the dev vm and the image
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      # bwrap, the jail, the cuaas user and uv, same as the dev vm
      - run: sudo image/provision.sh
      - run: uv sync --locked
      - run: just lint
      - run: just test
      - run: just test-sandbox

  deploy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      # uv on the runner, for pytest outside the container. the version provision.sh pins
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.13.1
      # lxd with a loop file pool, the runner has no spare disk
      - run: sudo host/setup.sh
      - run: just test-deploy
