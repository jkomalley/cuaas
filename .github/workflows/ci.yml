name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # same release as the dev vm and the image
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      # bwrap, the jail, the cuaas user and uv, same as the dev vm
      - run: sudo image/provision.sh
      - run: uv sync --locked
      - run: just lint
      - run: just test
      - run: just test-sandbox
