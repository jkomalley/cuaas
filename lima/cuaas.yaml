# dev vm. use `just vm-up`, it adds the repo mount and runs the setup scripts
minimumLimaVersion: 2.0.0
base: template:ubuntu-26.04

cpus: 4
memory: 4GiB
disk: 30GiB

containerd:
  system: false
  user: false

# dedicated disk for the lxd pool, mounted at /mnt/lima-cuaas-lxd. created by
# `just vm-up`
additionalDisks:
  - name: cuaas-lxd
    format: true
    fsType: btrfs
