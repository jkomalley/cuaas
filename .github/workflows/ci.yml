name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      # version matches provision.sh
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.13.1
      - run: uv sync --locked
      - run: just lint

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      # bwrap, /jail, the cuaas user, uv
      - run: sudo image/provision.sh
      - run: uv sync --locked
      - run: just test

  deployed:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      # pytest runs out here against the container. version matches provision.sh
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.13.1
      # no spare block device on the runner, pool is a loop file
      - run: sudo env LXD_DEBUG=1 host/setup.sh
      - run: just test-deployed
